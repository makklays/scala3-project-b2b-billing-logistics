version: '3.8'

services:
  # --- СУБД PostgreSQL ---
  postgres_db:
    image: postgres:15-alpine
    container_name: techmatrix_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root_master_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform_network

  # --- Наше Play Framework Scala Приложение ---
  auth_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techmatrix_auth_app
    ports:
      - "9000:9000"
    environment:
      - PLAY_SECRET_KEY=super-secure-techmatrix-production-secret-key-2026
      # Переопределяем настройки подключения к БД из application.conf для докер-сети
      - DB_DEFAULT_URL=jdbc:postgresql://postgres_db:5432/billing_logistics_db
      - DB_DEFAULT_USER=techmatrix_user
      - DB_DEFAULT_PASSWORD=secure_db_pass_2026
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - platform_network

volumes:
  postgres_data:

networks:
  platform_network:
    driver: bridge

